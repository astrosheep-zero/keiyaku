name: Audit workspace export
on:
  push:
    branches: [work/audit-export-20260909]
    paths: [.github/workflows/audit-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Export current final-fix bases without credentials
        run: git bundle create /tmp/keiyaku-audit-source.bundle --all
      - uses: actions/upload-artifact@v4
        with:
          name: keiyaku-audit-source
          path: /tmp/keiyaku-audit-source.bundle
          retention-days: 1
          compression-level: 0

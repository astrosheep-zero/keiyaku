name: Publish verified audit fix
on:
  push:
    branches: [work/audit-export-20260909]
    paths: [.github/workflows/audit-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 517274f81657f16e4d2fdd3dd04b99b97e9138e0
      - name: Apply exact reviewed tree on its pinned base
        shell: python
        run: |
          import base64, hashlib, json, pathlib, subprocess, zlib
          change = json.loads(r'''{"branch": "fix/literal-checkout-paths", "base": "517274f81657f16e4d2fdd3dd04b99b97e9138e0", "baseTree": "00d5f10d68fc3487e1801036c3549a23e3b3fb6c", "tree": "4dbfac33b7ed2fb2ad087adbe5901627c74004c8", "message": "fix(git): compare checkout paths literally", "patch": "", "sha256": "09c78c873e18319a1e8d018b6a60a75d0bc6298752f1a40321dad11b5faa9dfd"}''')
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          assert git("rev-parse", "HEAD^{tree}") == change["baseTree"], "base changed"
          patch = zlib.decompress(base64.b64decode(change["patch"]))
          assert hashlib.sha256(patch).hexdigest() == change["sha256"]
          pathlib.Path("/tmp/audit-fix.patch").write_bytes(patch)
          subprocess.run(["git", "apply", "--index", "--binary", "/tmp/audit-fix.patch"], check=True)
          assert git("write-tree") == change["tree"], "tree differs from locally verified files"
          git("config", "user.name", "OpenAI")
          git("config", "user.email", "noreply@openai.com")
          git("commit", "-m", change["message"])
          git("push", "origin", "HEAD:refs/heads/" + change["branch"])
          print(json.dumps({"branch": change["branch"], "commit": git("rev-parse", "HEAD"), "tree": change["tree"]}))

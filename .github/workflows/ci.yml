name: Publish minimal real test fixtures
on:
  push:
    branches: [test-diet/publish-api-boundary-20260918]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Checksum the test-only edit plan
        run: |
          python3 - <<'PY'
          import hashlib, pathlib
          data = pathlib.Path('.test-audit/batch15-edits.json').read_bytes()
          assert hashlib.sha256(data).hexdigest() == '61592a449546b76ba9d4dfa913e0e5eab546d6fb1716be3e42ed88735bb6ce99'
          pathlib.Path('/tmp/batch15-edits.json').write_bytes(data)
          PY
      - name: Publish exact checked tree
        run: |
          git checkout --detach 28899b020d91354f0ac8a68833bf589728104e3c
          python3 - <<'PY'
          import json, pathlib
          for name, pieces in json.loads(pathlib.Path('/tmp/batch15-edits.json').read_text()).items():
              path = pathlib.Path(name)
              assert name.startswith('tests/') and '..' not in path.parts
              old = path.read_text().splitlines(keepends=True)
              path.write_text(''.join(piece if isinstance(piece, str) else ''.join(old[piece[0]:piece[1]]) for piece in pieces))
          PY
          git add tests
          git diff --cached --check
          test "$(git write-tree)" = 605472b88c2fcda45232d2f425e45519697fd746
          git config user.name 'Keiyaku Test Maintenance'
          git config user.email 'keiyaku-ci@example.invalid'
          git commit -m 'test: right-size catalogue and publication fixtures and publish atomic pid receipts'
          test -z "$(git ls-remote --heads origin refs/heads/test-diet/15-minimal-real-fixtures)"
          git push origin HEAD:refs/heads/test-diet/15-minimal-real-fixtures
          git rev-parse HEAD HEAD^{tree}

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      windows_test_files:
        description: "Space-separated Windows native test files (empty runs the native suite)"
        required: false
        default: ""
      windows_test_name:
        description: "Optional Node test name pattern for the Windows native suite"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: ubuntu-24.04 / full verification
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_test_files == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --prefer-offline

      - name: Configure Git identity for external worktree fixtures
        run: |
          git config --global user.name "Keiyaku CI"
          git config --global user.email "keiyaku-ci@example.invalid"

      - name: Run repository verification
        run: npm test

      - name: Run packaged CLI end-to-end test
        run: npm run test:e2e

      - name: Typecheck source, scripts, and scoped semantic tests
        run: npm run test:typecheck

      - name: Lint source, scripts, and tests
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check patch whitespace
        run: git diff --check

  minimum-node:
    name: ubuntu-24.04 / minimum Node.js verification
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_test_files == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --prefer-offline

      - name: Run repository verification
        run: npm test -- --runInBand

      - name: Typecheck source, scripts, and scoped semantic tests
        run: npm run test:typecheck

      - name: Lint source, scripts, and tests
        run: npm run lint

  windows-native:
    name: windows-2022 / native behavioral suite
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --prefer-offline

      - name: Build
        run: npm run build

      - name: Run Windows-native behavioral tests
        env:
          WINDOWS_TEST_FILES: ${{ inputs.windows_test_files }}
          WINDOWS_TEST_NAME: ${{ inputs.windows_test_name }}
        shell: pwsh
        run: |
          $nodeArgs = @(
            "--import", "tsx",
            "scripts/run-tests.mjs",
            "--test-concurrency=1",
            "--test-reporter=spec",
            "--test-timeout=30000"
          )
          if ($env:WINDOWS_TEST_NAME.Trim()) {
            $nodeArgs += "--test-name-pattern"
            $nodeArgs += $env:WINDOWS_TEST_NAME
          }
          if ($env:WINDOWS_TEST_FILES.Trim()) {
            $nodeArgs += @($env:WINDOWS_TEST_FILES -split "\s+" | Where-Object { $_ })
          } else {
            $nodeArgs += @(
              "tests/actor.test.ts",
              "tests/akuma-heart.test.ts",
              "tests/akuma-identity.test.ts",
              "tests/amend-body.test.ts",
              "tests/arc.test.ts",
              "tests/contract-document.test.ts",
              "tests/dependency-currentness.test.ts",
              "tests/fold.test.ts",
              "tests/markdown-ast.test.ts",
              "tests/model-impact.test.ts",
              "tests/namespace-context.test.ts",
              "tests/normalized-identity.test.ts",
              "tests/observation.test.ts",
              "tests/runtime-proc.test.ts",
              "tests/windows-akuma-process.test.ts",
              "tests/settings.test.ts",
              "tests/sqlite-transaction-lock.test.ts",
              "tests/task-document.test.ts",
              "tests/task-operations.test.ts",
              "tests/world.test.ts",
              "tests/path-coordinates.test.ts"
            )
          }
          & node @nodeArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check patch whitespace
        run: git diff --check

  windows-msys:
    name: windows-2022 / Git Bash coordinate smoke
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --prefer-offline

      - name: Build
        run: npm run build

      - name: Run Git Bash coordinate smoke
        shell: pwsh
        run: |
          $bash = Join-Path $env:ProgramFiles "Git\bin\bash.exe"
          if (!(Test-Path $bash)) { throw "Git Bash is unavailable: $bash" }
          $script = @'
          set -euo pipefail
          repository="$PWD/.keiyaku-msys-coordinate-$RANDOM"
          trap 'rm -rf "$repository"' EXIT
          git init --quiet --initial-branch=main "$repository"
          git -C "$repository" config user.name "Keiyaku CI"
          git -C "$repository" config user.email "keiyaku-ci@example.invalid"
          git -C "$repository" commit --quiet --allow-empty -m initial
          cat <<'KEIYAKU' | node "$PWD/build/src/cli/index.js" -C "$repository" --repo "$repository" bind -
          # Git Bash coordinates

          ## Context
          Git Bash converts ordinary path arguments before Node starts.

          ## Objective
          Exercise one managed worktree lifecycle.

          ## Design
          Keep native coordinates inside the process.

          ## Region
          ~~~
          src/**
          ~~~

          ## Criteria
          ### Coordinate accepted
          The contract binds from Git Bash.
          KEIYAKU
          test -d "$repository/.keiyaku/wt"
          '@
          & $bash --noprofile --norc -lc $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-e2e:
    name: windows-2022 / packaged CLI e2e
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_test_files == '' }}
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --prefer-offline

      - name: Run packaged CLI end-to-end test
        run: npm run test:e2e

      - name: Typecheck source, scripts, and scoped semantic tests
        run: npm run test:typecheck

  macos-e2e:
    name: macos-14 / packaged CLI e2e
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_test_files == '' }}
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --prefer-offline

      - name: Run packaged CLI end-to-end test
        run: npm run test:e2e

      - name: Run filesystem coordinate tests
        run: npm run test:focused -- tests/path-coordinates.test.ts

      - name: Typecheck source, scripts, and scoped semantic tests
        run: npm run test:typecheck

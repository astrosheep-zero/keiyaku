name: Publish checked test scheduling batch
on:
  push:
    branches: [chore/publish-test-diet-20260918]
    paths: [.github/workflows/ci.yml, .test-audit/**]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Preserve exact reviewed patch outside checkout
        run: cp -R .test-audit "$RUNNER_TEMP/test-diet-publish"
      - name: Publish only the new review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --detach 4a5dccaa7c6d577a4ffc6b05bf26d6c9d02e84d8
          python3 "$RUNNER_TEMP/test-diet-publish/publish-next.py" "$RUNNER_TEMP/test-diet-publish/next.json"

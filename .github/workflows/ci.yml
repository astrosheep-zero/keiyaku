name: Publish reviewed test fixture cleanup

on:
  push:
    branches:
      - chore/test-audit-snapshot-20260917

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Prepare the pinned source and reviewed transform
        run: |
          cp .test-audit/publish-cleanup.mjs /tmp/publish-cleanup.mjs
          git checkout --detach bc1b478d8738d546e32e73790ab53565dc7cffc0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci --ignore-scripts --prefer-offline
      - name: Reproduce the locally validated patch
        run: |
          node /tmp/publish-cleanup.mjs
          node node_modules/prettier/bin/prettier.cjs --write --print-width 120 tests/akuma-provider.test.ts tests/akuma-body-requests.test.ts tests/akuma-api.test.ts tests/akuma-schema.test.ts tests/support/akuma-tell.ts
          git add tests
          git diff --cached --check
          test "$(git write-tree)" = 0511747a37366bb53682b8295d540bf4339ccbaa
          git diff --cached --stat
      - name: Publish a new review branch, never main
        run: |
          test -z "$(git ls-remote --heads origin refs/heads/test-diet/02-dedupe-fixtures)"
          git -c user.name='astrosheep' -c user.email='robot.koc@outlook.com' commit -m 'test: consolidate repeated provider and Tell fixtures'
          git push origin HEAD:refs/heads/test-diet/02-dedupe-fixtures

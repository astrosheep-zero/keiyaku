name: Test audit source snapshot

on:
  push:
    branches:
      - chore/test-audit-snapshot-20260917

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: bc1b478d8738d546e32e73790ab53565dc7cffc0
          persist-credentials: false
      - name: Archive the pinned public source for test analysis
        run: git archive --format=tar.gz --output=keiyaku-baseline.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: keiyaku-test-audit-baseline-source
          path: keiyaku-baseline.tar.gz
          retention-days: 1

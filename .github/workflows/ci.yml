name: Publish bounded test source queue
on:
  push:
    branches: [test-diet/publish-api-boundary-20260918]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Checksum the locally verified patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, pathlib, zlib
          data=zlib.decompress(base64.b64decode(pathlib.Path('.test-audit/batch13.patch.zlib64').read_text()))
          assert hashlib.sha256(data).hexdigest() == '1b85e64037590d6cd77ffadfb20b7f6e87af786c114fc3398ccdb425dedc82dc'
          pathlib.Path('/tmp/batch13.patch').write_bytes(data)
          PY
      - name: Publish the exact checked tree
        run: |
          git checkout --detach d87815d350476fb12f8dbcaa0ae0940372f62a39
          git apply --index /tmp/batch13.patch
          git diff --cached --check
          test "$(git write-tree)" = 584d90e908a2a72cb7d4d8d544a88aaf934ca7a1
          git config user.name 'Keiyaku Test Maintenance'
          git config user.email 'keiyaku-ci@example.invalid'
          git commit -m 'test: overlap a bounded source-gate queue with verified runtime preparation'
          test -z "$(git ls-remote --heads origin refs/heads/test-diet/13-bounded-static-queue)"
          git push origin HEAD:refs/heads/test-diet/13-bounded-static-queue
          git rev-parse HEAD HEAD^{tree}

name: Publish deliberate integration pruning
on:
  push:
    branches: [chore/test-diet-snapshot-20260918]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Preserve reviewed transform and select pinned parent
        run: |
          cp .test-audit/batch11.mjs /tmp/batch11.mjs
          cp .test-audit/batch11-maintainability.js /tmp/batch11-maintainability.js
          git checkout --detach 192a18007a1f3cedf865bac3214bb97b8b7496f7
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci --ignore-scripts --prefer-offline
      - name: Reproduce exact local tree and publish review branch
        run: |
          node /tmp/batch11.mjs
          node node_modules/prettier/bin/prettier.cjs --write --print-width 120 $(git diff --name-only)
          git add tests
          git diff --cached --check
          test "$(git write-tree)" = fb0cceceb10c7202f1c5a3ebb73091cefa4b082f
          test -z "$(git ls-remote --heads origin refs/heads/test-diet/11-prune-composite-overlays)"
          git config user.name 'Keiyaku Test Optimization'
          git config user.email 'keiyaku-test@example.invalid'
          git commit -m 'test: retire composite overlays and isolate maintainability CLI fixtures'
          git push origin HEAD:refs/heads/test-diet/11-prune-composite-overlays

name: Publish pinned test reduction batches
on:
  push:
    branches: [test-diet/publish-20260918]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reproduce exact candidate trees and publish review branches only
        shell: bash
        run: |
          cp -R .test-diet-publish /tmp/keiyaku-test-diet-publish
          git config user.name 'Test Diet'
          git config user.email 'test-diet@example.invalid'
          git checkout --detach bc1b478d8738d546e32e73790ab53565dc7cffc0
          git cherry-pick 2b98e8eb509424ebc59739baab459f4479d3fd24 ecadd1847385f8e74f7645fcb1d37c180e66aa74
          python3 - <<'PY'
          import json, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          if git('rev-parse', 'HEAD^{tree}') != '787e45aa11130516977020ff1b71cee7bac621e1':
              raise SystemExit('Prior PR tree mismatch')
          plans = [
              (1, 'test-diet/04-core-consolidation', '7ba420d2d9507a70e6fbbe56859cf42e805ed0a9', 'test: consolidate core boundaries and fixtures (batch 4)'),
              (2, 'test-diet/05-akuma-consolidation', '02a786f2352907cbd36dc4c7f89d6af6e58dc1be', 'test: consolidate Akuma provider and lifecycle coverage (batch 5)'),
              (3, 'test-diet/06-integration-consolidation', '13da30ba2d06474444ead652029155ca261d69f6', 'test: consolidate Git CLI and integration coverage (batch 6)'),
          ]
          for number, branch, expected, message in plans:
              directory = pathlib.Path('/tmp/keiyaku-test-diet-publish')
              recipe_files = sorted(directory.glob(f'batch{number}*.json'))
              if not recipe_files:
                  break
              recipe = {}
              for file in recipe_files:
                  data = json.loads(file.read_text())
                  if recipe.keys() & data.keys():
                      raise SystemExit('Duplicate output path')
                  recipe.update(data)
              def safe(path):
                  p = pathlib.PurePosixPath(path)
                  if not path.startswith('tests/') or '..' in p.parts or p.is_absolute():
                      raise SystemExit('Only test source paths are allowed')
                  return path
              inputs = {}
              for path, pieces in recipe.items():
                  safe(path)
                  for piece in pieces:
                      if not isinstance(piece, str):
                          source = safe(piece[0] or path)
                          inputs.setdefault(source, pathlib.Path(source).read_text().splitlines(keepends=True))
              for path, pieces in recipe.items():
                  output = []
                  for piece in pieces:
                      if isinstance(piece, str):
                          output.append(piece)
                          continue
                      source, start, end, indentation = piece
                      lines = inputs[source or path]
                      if not 0 <= start <= end <= len(lines):
                          raise SystemExit('Invalid source span')
                      for line in lines[start:end]:
                          output.append(line if not line.strip() else (' ' * indentation + line if indentation >= 0 else line[-indentation:]))
                  pathlib.Path(path).parent.mkdir(parents=True, exist_ok=True)
                  pathlib.Path(path).write_text(''.join(output))
              subprocess.run(['git', 'add', 'tests'], check=True)
              subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
              if git('write-tree') != expected:
                  raise SystemExit(f'Candidate tree mismatch for batch {number}: {git("write-tree")}')
              subprocess.run(['git', 'commit', '-m', message], check=True)
              existing = git('ls-remote', '--heads', 'origin', f'refs/heads/{branch}')
              if existing:
                  subprocess.run(['git', 'fetch', 'origin', f'refs/heads/{branch}'], check=True)
                  if git('rev-parse', 'FETCH_HEAD^{tree}') != expected:
                      raise SystemExit('Refusing to overwrite an existing different review branch')
                  subprocess.run(['git', 'checkout', '--detach', 'FETCH_HEAD'], check=True)
              else:
                  subprocess.run(['git', 'push', 'origin', f'HEAD:refs/heads/{branch}'], check=True)
              count = sum(len(p.read_text().splitlines()) for p in pathlib.Path('tests').rglob('*') if p.is_file() and p.suffix in ('.ts', '.js', '.mjs', '.cjs'))
              print(json.dumps({'batch': number, 'branch': branch, 'sha': git('rev-parse', 'HEAD'), 'tree': expected, 'test_lines': count}), flush=True)
          PY

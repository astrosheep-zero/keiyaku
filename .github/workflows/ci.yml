name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: ubuntu-24.04 / full verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --prefer-offline

      - name: Configure Git identity for external worktree fixtures
        run: |
          git config --global user.name "Keiyaku CI"
          git config --global user.email "keiyaku-ci@example.invalid"

      - name: Run repository verification
        run: npm test

      - name: Run packaged CLI end-to-end test
        run: npm run test:e2e

      - name: Typecheck
        run: npm run test:typecheck

      - name: Build
        run: npm run build

      - name: Check patch whitespace
        run: git diff --check

  windows-native:
    name: windows-2022 / native behavioral suite
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --prefer-offline

      - name: Build
        run: npm run build

      - name: Run Windows-native behavioral tests
        run: >-
          node --import tsx scripts/run-tests.mjs --test-concurrency=1
          tests/actor.test.ts
          tests/akuma-heart.test.ts
          tests/akuma-identity.test.ts
          tests/amend-body.test.ts
          tests/arc.test.ts
          tests/contract-document.test.ts
          tests/dependency-currentness.test.ts
          tests/documentation.test.ts
          tests/fold.test.ts
          tests/markdown-ast.test.ts
          tests/model-impact.test.ts
          tests/namespace-context.test.ts
          tests/normalized-identity.test.ts
          tests/observation.test.ts
          tests/runtime-proc.test.ts
          tests/windows-akuma-process.test.ts
          tests/settings.test.ts
          tests/sqlite-transaction-lock.test.ts
          tests/task-document.test.ts
          tests/task-operations.test.ts
          tests/world.test.ts

      - name: Check patch whitespace
        run: git diff --check

  windows-e2e:
    name: windows-2022 / packaged CLI e2e
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --prefer-offline

      - name: Run packaged CLI end-to-end test
        run: npm run test:e2e

      - name: Typecheck
        run: npm run test:typecheck

  macos-e2e:
    name: macos-14 / packaged CLI e2e
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --prefer-offline

      - name: Run packaged CLI end-to-end test
        run: npm run test:e2e

      - name: Typecheck
        run: npm run test:typecheck

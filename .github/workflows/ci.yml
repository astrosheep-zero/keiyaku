name: Publish pinned test-diet candidates
on:
  push:
    branches: [chore/publish-test-diet-20260918]
    paths: [.github/workflows/ci.yml, .test-audit/**]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Preserve exact candidate recipes outside the checkout
        run: cp -R .test-audit "$RUNNER_TEMP/test-diet-publish"
      - name: Publish only new review branches, never main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --detach 2b98e8eb509424ebc59739baab459f4479d3fd24
          git cherry-pick ecadd1847385f8e74f7645fcb1d37c180e66aa74
          python3 "$RUNNER_TEMP/test-diet-publish/publish.py" "$RUNNER_TEMP/test-diet-publish"

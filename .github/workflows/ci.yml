name: Test diet paired benchmark 62

on:
  push:
    branches:
      - test-diet/benchmark-61-20260918

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.1
      - run: npm ci --ignore-scripts --prefer-offline
      - name: Configure Git identity
        run: |
          git config --global user.name "Keiyaku CI"
          git config --global user.email "keiyaku-ci@example.invalid"
      - name: Prime compiler artifacts equally
        run: |
          git checkout --detach bc1b478d8738d546e32e73790ab53565dc7cffc0
          npm run build >/dev/null
          git checkout --detach 432fac59e4d6dac41618b0750860a15e4179f88f
          npm run build >/dev/null
      - name: Run paired benchmark
        run: |
          mkdir -p /tmp/bench
          python3 - <<'PY'
          import json, pathlib, re, statistics, subprocess, time
          out=pathlib.Path('/tmp/bench')
          base='bc1b478d8738d546e32e73790ab53565dc7cffc0'
          cand='432fac59e4d6dac41618b0750860a15e4179f88f'
          rows=[]
          order=[('baseline',1),('candidate',1),('candidate',2),('baseline',2),('baseline',3),('candidate',3)]
          for label,trial in order:
              ref=base if label=='baseline' else cand
              subprocess.run(['git','checkout','--detach',ref],check=True,stdout=subprocess.DEVNULL)
              log=out/f'{label}-{trial}.log'
              started=time.monotonic()
              code=124; timed_out=False
              try:
                  with log.open('w') as stream:
                      result=subprocess.run(['npm','test'],stdout=stream,stderr=subprocess.STDOUT,timeout=180)
                  code=result.returncode
              except subprocess.TimeoutExpired:
                  timed_out=True
              elapsed=time.monotonic()-started
              text=log.read_text() if log.exists() else ''
              m=re.search(r'\[test:release\] tests (\d+) status=(\d+)',text)
              rows.append({'variant':label,'trial':trial,'wall_seconds':round(elapsed,3),'tests_seconds':int(m.group(1))/1000 if m else None,'exit_code':code,'timed_out':timed_out,'completed_test_phase':bool(m)})
              (out/'results.json').write_text(json.dumps({'runs':rows},indent=2))
              print(json.dumps(rows[-1]),flush=True)
          passed=all(r['exit_code']==0 and not r['timed_out'] and r['tests_seconds'] is not None for r in rows)
          payload={'refs':{'baseline':base,'candidate':cand},'node':subprocess.check_output(['node','--version'],text=True).strip(),'cpus':subprocess.check_output(['nproc'],text=True).strip(),'runs':rows,'all_six_passed':passed}
          if passed:
              med={v:{k:statistics.median(r[k] for r in rows if r['variant']==v) for k in ('wall_seconds','tests_seconds')} for v in ('baseline','candidate')}
              payload['medians']=med
              payload['reduction_percent']={k:round(100*(1-med['candidate'][k]/med['baseline'][k]),2) for k in ('wall_seconds','tests_seconds')}
          (out/'results.json').write_text(json.dumps(payload,indent=2))
          print(json.dumps(payload,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-benchmark-62
          path: /tmp/bench/
          retention-days: 7

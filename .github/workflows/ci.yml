name: Publish cross-product test scope reduction
on:
  push:
    branches: [test-diet/publish-api-boundary-20260918]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Checksum the test-only edit plan
        run: |
          python3 - <<'PY'
          import hashlib, pathlib
          data = pathlib.Path('.test-audit/batch14-edits.json').read_bytes()
          data = data.replace(b'../src/cli/parse.js\\",\\n', b'../src/cli/parse.js\\";\\n')
          assert hashlib.sha256(data).hexdigest() == '0d33a9126e86ca3632c80669f59e6b79b8ecf852d94dd655422d5e35f1eafac8'
          pathlib.Path('/tmp/batch14-edits.json').write_bytes(data)
          PY
      - name: Publish exact checked tree
        run: |
          git checkout --detach 819bfc9b86297589077171eae7e54a06a5dcee44
          python3 - <<'PY'
          import json, pathlib
          for name, pieces in json.loads(pathlib.Path('/tmp/batch14-edits.json').read_text()).items():
              path = pathlib.Path(name)
              assert name.startswith('tests/') and '..' not in path.parts
              old = path.read_text().splitlines(keepends=True)
              path.write_text(''.join(piece if isinstance(piece, str) else ''.join(old[piece[0]:piece[1]]) for piece in pieces))
          PY
          git add tests
          git diff --cached --check
          test "$(git write-tree)" = fbec36f82993a3e2654196945fef9b516fb1f39c
          git config user.name 'Keiyaku Test Maintenance'
          git config user.email 'keiyaku-ci@example.invalid'
          git commit -m 'test: retire costly cross-product overlays and their dead fixtures'
          test -z "$(git ls-remote --heads origin refs/heads/test-diet/14-prune-cross-product-overlays)"
          git push origin HEAD:refs/heads/test-diet/14-prune-cross-product-overlays
          git rev-parse HEAD HEAD^{tree}

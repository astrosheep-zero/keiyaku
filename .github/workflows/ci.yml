name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      windows_test_files:
        description: "Space-separated Windows native test files (empty runs the native suite)"
        required: false
        default: ""
      windows_test_name:
        description: "Optional Node test name pattern for the Windows native suite"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: ubuntu-24.04 / full verification
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_test_files == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --prefer-offline

      - name: Configure Git identity for external worktree fixtures
        run: |
          git config --global user.name "Keiyaku CI"
          git config --global user.email "keiyaku-ci@example.invalid"

      - name: Check formatting
        run: npm run format:check

      - name: Build once
        run: npm run build

      - name: Typecheck tests and scripts
        run: npm run test:typecheck:aux

      - name: Check architecture
        run: npm run test:architecture

      - name: Check maintainability
        run: npm run test:maintainability

      - name: Lint tests
        run: npm run lint:tests

      - name: Check reachability
        run: npm run test:reachability

      - name: Run optimized behavioral suites
        run: npm run test:parallel

      - name: Run packaged CLI end-to-end test from the existing build
        run: npm run test:e2e:built

      - name: Check patch whitespace
        run: git diff --check

  minimum-node:
    name: ubuntu-24.04 / minimum Node.js package smoke
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_test_files == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --prefer-offline

      - name: Configure Git identity for external worktree fixtures
        run: |
          git config --global user.name "Keiyaku CI"
          git config --global user.email "keiyaku-ci@example.invalid"

      - name: Build once
        run: npm run build

      - name: Run packaged CLI end-to-end test from the existing build
        run: npm run test:e2e:built

  windows-native:
    name: windows-2022 / native behavioral suite
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --prefer-offline

      - name: Build
        run: npm run build

      - name: Run Windows-native behavioral tests
        env:
          WINDOWS_TEST_FILES: ${{ inputs.windows_test_files }}
          WINDOWS_TEST_NAME: ${{ inputs.windows_test_name }}
        shell: pwsh
        run: |
          $baseArgs = @(
            "--import", "tsx",
            "scripts/run-tests.mjs",
            "--test-reporter=spec",
            "--test-timeout=30000"
          )
          $platformFiles = @(
            "tests/namespace-context.test.ts",
            "tests/runtime-proc.test.ts",
            "tests/windows-akuma-process.test.ts",
            "tests/sqlite-transaction-lock.test.ts",
            "tests/task-operations.test.ts",
            "tests/world.test.ts",
            "tests/path-coordinates.test.ts"
          )
          $customFiles = @($env:WINDOWS_TEST_FILES -split "\s+" | Where-Object { $_ })
          if ($customFiles.Count -gt 0 -or $env:WINDOWS_TEST_NAME.Trim()) {
            $selectedFiles = if ($customFiles.Count -gt 0) { $customFiles } else { $platformFiles + "tests/akuma-heart.test.ts" }
            $nodeArgs = @($baseArgs) + @("--test-concurrency=2")
            if ($env:WINDOWS_TEST_NAME.Trim()) {
              $nodeArgs += "--test-name-pattern"
              $nodeArgs += $env:WINDOWS_TEST_NAME
            }
            $nodeArgs += $selectedFiles
            & node @nodeArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            $nodeArgs = @($baseArgs) + @("--test-concurrency=2") + $platformFiles
            & node @nodeArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $heartPattern = "existing Heart opens|existing non-database Heart paths|heart schema version"
            $nodeArgs = @($baseArgs) + @(
              "--test-concurrency=1",
              "--test-name-pattern", $heartPattern,
              "tests/akuma-heart.test.ts"
            )
            & node @nodeArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run Git Bash coordinate smoke
        shell: pwsh
        run: |
          $bash = Join-Path $env:ProgramFiles "Git\bin\bash.exe"
          if (!(Test-Path $bash)) { throw "Git Bash is unavailable: $bash" }
          $script = @'
          set -euo pipefail
          repository="$PWD/.keiyaku-msys-coordinate-$RANDOM"
          trap 'rm -rf "$repository"' EXIT
          git init --quiet --initial-branch=main "$repository"
          git -C "$repository" config user.name "Keiyaku CI"
          git -C "$repository" config user.email "keiyaku-ci@example.invalid"
          git -C "$repository" commit --quiet --allow-empty -m initial
          cat <<'KEIYAKU' | node "$PWD/build/src/cli/index.js" -C "$repository" --repo "$repository" bind -
          # Git Bash coordinates

          ## Context
          Git Bash converts ordinary path arguments before Node starts.

          ## Objective
          Exercise one managed worktree lifecycle.

          ## Design
          Keep native coordinates inside the process.

          ## Region
          ~~~
          src/**
          ~~~

          ## Criteria
          ### Coordinate accepted
          The contract binds from Git Bash.
          KEIYAKU
          test -d "$repository/.keiyaku/wt"
          '@
          & $bash --noprofile --norc -lc $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check patch whitespace
        run: git diff --check

  windows-e2e:
    name: windows-2022 / packaged CLI e2e
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_test_files == '' }}
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --prefer-offline

      - name: Run packaged CLI end-to-end test
        run: npm run test:e2e

  macos-smoke:
    name: macos-14 / filesystem and coordinate smoke
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_test_files == '' }}
    runs-on: macos-14
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --prefer-offline

      - name: Run filesystem and coordinate tests
        run: >-
          node scripts/run-tests.mjs
          --test-concurrency=3
          tests/path-coordinates.test.ts
          tests/world.test.ts
          tests/namespace-context.test.ts

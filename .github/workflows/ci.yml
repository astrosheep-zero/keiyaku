name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: ${{ matrix.os }} / Node 22.19.0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022
          - macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --prefer-offline

      - name: Run repository verification
        run: npm test

      - name: Run packaged CLI end-to-end test
        run: npm run test:e2e

      - name: Typecheck
        run: npm run test:typecheck

      - name: Build
        run: npm run build

      - name: Check patch whitespace
        run: git diff --check

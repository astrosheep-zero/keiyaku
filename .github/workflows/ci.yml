name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: ubuntu-24.04 / full verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --prefer-offline

      - name: Run repository verification
        run: npm test

      - name: Run packaged CLI end-to-end test
        run: npm run test:e2e

      - name: Typecheck
        run: npm run test:typecheck

      - name: Build
        run: npm run build

      - name: Check patch whitespace
        run: git diff --check

  windows-behavior:
    name: windows-2022 / behavior ${{ matrix.shard }}
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1/4
          - 2/4
          - 3/4
          - 4/4

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --prefer-offline

      - name: Build
        run: npm run build

      - name: Run behavioral test shard
        run: node --import tsx scripts/run-tests.mjs --test-shard=${{ matrix.shard }} --test-concurrency=1

      - name: Check patch whitespace
        run: git diff --check

  windows-e2e:
    name: windows-2022 / packaged CLI e2e
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --prefer-offline

      - name: Run packaged CLI end-to-end test
        run: npm run test:e2e

      - name: Typecheck
        run: npm run test:typecheck

  macos-e2e:
    name: macos-14 / packaged CLI e2e
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --prefer-offline

      - name: Run packaged CLI end-to-end test
        run: npm run test:e2e

      - name: Typecheck
        run: npm run test:typecheck

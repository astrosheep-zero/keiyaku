name: Test diet final paired verification
on:
  push:
    branches: [work/test-diet-publish-20260918]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Export the exact published candidate and repository history
        run: |
          mkdir -p "$RUNNER_TEMP/test-diet-snapshot"
          git archive --format=tar.gz 773b9de8ae9da0b7c27bd22b4fc174038c11679f > "$RUNNER_TEMP/test-diet-snapshot/candidate.tar.gz"
          git bundle create "$RUNNER_TEMP/test-diet-snapshot/repository.bundle" --all
      - uses: actions/upload-artifact@v4
        with:
          name: test-diet-published-source
          path: ${{ runner.temp }}/test-diet-snapshot
          retention-days: 7
      - name: Select the pinned baseline
        run: git checkout --detach bc1b478d8738d546e32e73790ab53565dc7cffc0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: npm
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.1
      - run: npm ci --ignore-scripts --prefer-offline
      - name: Set fixture identity and prime the unchanged compiler cache
        run: |
          git config --global user.name 'Keiyaku CI'
          git config --global user.email 'keiyaku-ci@example.invalid'
          npm run build
      - name: Alternate three complete workloads per variant
        shell: bash
        run: |
          python3 -u - <<'PY'
          import json, os, pathlib, re, signal, statistics, subprocess, time
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'paired-results'
          out.mkdir()
          refs = {'baseline': 'bc1b478d8738d546e32e73790ab53565dc7cffc0', 'candidate': '773b9de8ae9da0b7c27bd22b4fc174038c11679f'}
          report = {'refs': refs, 'command': 'npm test', 'node': subprocess.check_output(['node', '--version'], text=True).strip(), 'cpus': os.cpu_count(), 'runs': []}
          for label, trial in [('baseline', 1), ('candidate', 1), ('candidate', 2), ('baseline', 2), ('baseline', 3), ('candidate', 3)]:
              subprocess.run(['git', 'checkout', '--detach', refs[label]], check=True)
              with (out / f'{label}-{trial}.log').open('w') as log:
                  start = time.monotonic()
                  child = subprocess.Popen(['npm', 'test'], stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
                  timeout = False
                  try:
                      code = child.wait(timeout=240)
                  except subprocess.TimeoutExpired:
                      timeout = True
                      os.killpg(child.pid, signal.SIGTERM)
                      try:
                          child.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          os.killpg(child.pid, signal.SIGKILL)
                          child.wait()
                      code = 124
                  elapsed = time.monotonic() - start
              text = (out / f'{label}-{trial}.log').read_text()
              match = re.search(r'\[test:release\] tests (\d+) status=(\d+)', text)
              row = {'variant': label, 'trial': trial, 'wall_seconds': round(elapsed, 3), 'tests_seconds': int(match[1]) / 1000 if match else None, 'exit_code': code, 'timed_out': timeout, 'completed_test_phase': bool(match)}
              report['runs'].append(row)
              (out / 'results.json').write_text(json.dumps(report, indent=2))
              print(json.dumps(row), flush=True)
              logs = pathlib.Path('.test-logs')
              if logs.exists():
                  import shutil
                  shutil.copytree(logs, out / f'{label}-{trial}-per-file', dirs_exist_ok=True)
                  shutil.rmtree(logs)
          complete = all(r['completed_test_phase'] and not r['timed_out'] for r in report['runs'])
          if complete:
              medians = {label: {metric: statistics.median(r[metric] for r in report['runs'] if r['variant'] == label) for metric in ['wall_seconds', 'tests_seconds']} for label in refs}
              report['medians'] = medians
              report['reduction_percent'] = {metric: round(100 * (1 - medians['candidate'][metric] / medians['baseline'][metric]), 2) for metric in ['wall_seconds', 'tests_seconds']}
          report['all_six_workloads_completed'] = complete
          report['all_six_passed'] = all(r['exit_code'] == 0 for r in report['runs'])
          (out / 'results.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2), flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-diet-final-paired-results
          path: ${{ runner.temp }}/paired-results
          retention-days: 7

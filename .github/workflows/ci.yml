name: Publish native test compilation
on:
  push:
    branches: [chore/test-diet-snapshot-20260918]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reproduce the locally verified tree on its pinned parent
        run: |
          cp .test-audit/batch10.patch /tmp/batch10.patch
          git checkout --detach bb110c2ab295674c5862f4a729e24ae6dfa00b9b
          git apply --index /tmp/batch10.patch
          git diff --cached --check
          test "$(git write-tree)" = e06649a3173b11bf0a14d58902dc8fabb73902e4
          test -z "$(git ls-remote --heads origin refs/heads/test-diet/10-native-compile-pipeline)"
          git config user.name 'Keiyaku Test Optimization'
          git config user.email 'keiyaku-test@example.invalid'
          git commit -m 'test: strip erasable TypeScript natively and overlap independent checks'
          git push origin HEAD:refs/heads/test-diet/10-native-compile-pipeline

name: Publish reviewed test fixture cleanup

on:
  push:
    branches:
      - chore/test-audit-snapshot-20260917

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: bc1b478d8738d546e32e73790ab53565dc7cffc0
      - name: Apply the locally validated test-only patch
        env:
          PATCH_ZLIB_BASE64: >-
            &
        run: |
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, zlib
          patch = zlib.decompress(base64.b64decode(os.environ['PATCH_ZLIB_BASE64']))
          expected = '7abbe4391d4ba04b32c2fd5dfc1b062aa5112a537389c26e3373e1413f34056e'
          assert hashlib.sha256(patch).hexdigest() == expected, 'patch integrity check failed'
          pathlib.Path('/tmp/test-diet-batch2.patch').write_bytes(patch)
          PY
          git apply --check /tmp/test-diet-batch2.patch
          git apply --index /tmp/test-diet-batch2.patch
          git diff --cached --check
          test "$(git diff --cached --name-only | grep -vc '^tests/')" = 0
          git -c user.name='astrosheep' -c user.email='robot.koc@outlook.com' commit -m 'test: consolidate repeated provider and Tell fixtures'
          git push origin HEAD:refs/heads/test-diet/02-dedupe-fixtures

name: Publish native test workers
on:
  push:
    branches: [test-diet/publish-20260918]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reconstruct exact reviewed test runner tree
        shell: bash
        run: |
          cp .test-diet-publish/batch8.json /tmp/test-diet-batch8.json
          git config user.name 'Test Diet'
          git config user.email 'test-diet@example.invalid'
          git checkout --detach ec5bf0a5221bdc4238c112486c6946da0125be27
          python3 - <<'PY'
          import json, pathlib
          recipe = json.loads(pathlib.Path('/tmp/test-diet-batch8.json').read_text())
          inputs = {}
          def safe(path):
              p = pathlib.PurePosixPath(path)
              if (not path.startswith('tests/') and path != 'scripts/run-tests.mjs') or '..' in p.parts or p.is_absolute():
                  raise SystemExit('Unexpected output path')
              return path
          for path, pieces in recipe.items():
              safe(path)
              for piece in pieces:
                  if not isinstance(piece, str):
                      source = safe(piece[0] or path)
                      inputs.setdefault(source, pathlib.Path(source).read_text().splitlines(keepends=True))
          for path, pieces in recipe.items():
              output = []
              for piece in pieces:
                  if isinstance(piece, str):
                      output.append(piece)
                      continue
                  source, start, end, indentation = piece
                  lines = inputs[source or path]
                  if not 0 <= start <= end <= len(lines):
                      raise SystemExit('Invalid source span')
                  for line in lines[start:end]:
                      output.append(line if not line.strip() else (' ' * indentation + line if indentation >= 0 else line[-indentation:]))
              pathlib.Path(path).write_text(''.join(output))
          PY
          git add tests scripts/run-tests.mjs
          git diff --cached --check
          test "$(git write-tree)" = bacad91c9a64c06d53bcac3fee14f0e9514bc639
          test -z "$(git ls-remote --heads origin refs/heads/test-diet/08-native-test-workers)"
          git commit -m 'test: remove nested worker forks and repeated fixture TypeScript loaders'
          git push origin HEAD:refs/heads/test-diet/08-native-test-workers

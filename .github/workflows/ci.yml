name: Publish Pi SDK boundary optimization
on:
  push:
    branches: [chore/test-diet-snapshot-20260918]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reproduce and publish the checked Pi SDK boundary patch
        run: |
          cp .test-audit/batch12.patch /tmp/batch12.patch
          git checkout --detach cb1c27d39e2cd6beed24f97e80d59d44b082b5c1
          git apply --index /tmp/batch12.patch
          git diff --cached --check
          test "$(git write-tree)" = da27ce3700f60e4e1e51b0266d65ca75931b86de
          test -z "$(git ls-remote --heads origin refs/heads/test-diet/12-pi-sdk-test-boundary)"
          git config user.name 'Keiyaku Test Optimization'
          git config user.email 'keiyaku-test@example.invalid'
          git commit -m 'test: isolate Pi adapter mapping from native SDK loading'
          git push origin HEAD:refs/heads/test-diet/12-pi-sdk-test-boundary

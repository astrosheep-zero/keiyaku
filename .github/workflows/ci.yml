name: Export pinned test audit source
on:
  push:
    branches: [test-diet/source-audit-20260918-001]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export public Git history at the current reduction candidate
        run: |
          git checkout --detach fe689c5381b1ccdfc55a3c435a481d44adb7dc9c
          test "$(git rev-parse HEAD^{tree})" = 5dfbf93fedb64e71c93a2231870970d725c10e6b
          mkdir -p /tmp/keiyaku-audit-source
          git bundle create /tmp/keiyaku-audit-source/source.bundle HEAD
          git rev-parse HEAD HEAD^{tree} > /tmp/keiyaku-audit-source/refs.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keiyaku-audit-source-tip54
          path: /tmp/keiyaku-audit-source/
          retention-days: 3

name: Test diet working snapshot
on:
  push:
    branches: [chore/test-diet-snapshot-20260918]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 14233098195c2f2897e9626e0f5159e66e1194ad
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve repository objects for offline test optimization
        run: git bundle create /tmp/keiyaku-pr42.bundle --all
      - uses: actions/upload-artifact@v4
        with:
          name: keiyaku-pr42-source
          path: /tmp/keiyaku-pr42.bundle
          retention-days: 1

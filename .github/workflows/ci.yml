name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      windows_test_files:
        description: "Space-separated Windows native test files (empty runs the native suite)"
        required: false
        default: ""
      windows_test_name:
        description: "Optional Node test name pattern for the Windows native suite"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: ubuntu-24.04 / full verification
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_test_files == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --prefer-offline

      - name: Configure Git identity for external worktree fixtures
        run: |
          git config --global user.name "Keiyaku CI"
          git config --global user.email "keiyaku-ci@example.invalid"

      - name: Run repository verification
        run: npm test

      - name: Run packaged CLI end-to-end test
        run: npm run test:e2e:built

      - name: Typecheck tests and scripts (source was checked by build)
        run: npm run test:typecheck:scoped-tests && npm run test:typecheck:scripts

      - name: Lint tests (source and scripts were checked by maintainability)
        run: npx --no-install eslint tests

      - name: Check patch whitespace
        run: git diff --check

  minimum-node:
    name: ubuntu-24.04 / minimum Node.js verification
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_test_files == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --prefer-offline

      - name: Configure Git identity for external worktree fixtures
        run: |
          git config --global user.name "Keiyaku CI"
          git config --global user.email "keiyaku-ci@example.invalid"

      - name: Build
        run: npm run build

      - name: Verify isolated runner on the minimum Node version
        run: npm run test:compile && node scripts/run-tests.mjs --compiled tests/run-tests.test.ts

      - name: Run packaged CLI end-to-end test
        run: npm run test:e2e:built

  windows-native:
    name: windows-2022 / native, package, and Git Bash
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --prefer-offline

      - name: Build
        id: build
        run: npm run build

      - name: Compile tests once
        run: npm run test:compile

      - name: Run Windows-native behavioral tests
        env:
          WINDOWS_TEST_FILES: ${{ inputs.windows_test_files }}
          WINDOWS_TEST_NAME: ${{ inputs.windows_test_name }}
        shell: pwsh
        run: |
          $nodeArgs = @(
            "scripts/run-tests.mjs",
            "--compiled",
            "--test-concurrency=1",
            "--test-reporter=spec",
            "--test-timeout=30000"
          )
          if ($env:WINDOWS_TEST_NAME.Trim()) {
            $nodeArgs += "--test-name-pattern"
            $nodeArgs += $env:WINDOWS_TEST_NAME
          }
          if ($env:WINDOWS_TEST_FILES.Trim()) {
            $nodeArgs += @($env:WINDOWS_TEST_FILES -split "\s+" | Where-Object { $_ })
          } else {
            $nodeArgs += @(
              "tests/akuma-heart.test.ts",
              "tests/akuma-identity.test.ts",
              "tests/namespace-context.test.ts",
              "tests/runtime-proc.test.ts",
              "tests/windows-akuma-process.test.ts",
              "tests/settings.test.ts",
              "tests/sqlite-transaction-lock.test.ts",
              "tests/task-operations.test.ts",
              "tests/world.test.ts",
              "tests/path-coordinates.test.ts"
            )
          }
          & node @nodeArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run packaged CLI end-to-end test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:e2e:built

      - name: Run Git Bash coordinate smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          $bash = Join-Path $env:ProgramFiles "Git\bin\bash.exe"
          if (!(Test-Path $bash)) { throw "Git Bash is unavailable: $bash" }
          $script = @'
          set -euo pipefail
          repository="$PWD/.keiyaku-msys-coordinate-$RANDOM"
          trap 'rm -rf "$repository"' EXIT
          git init --quiet --initial-branch=main "$repository"
          git -C "$repository" config user.name "Keiyaku CI"
          git -C "$repository" config user.email "keiyaku-ci@example.invalid"
          git -C "$repository" commit --quiet --allow-empty -m initial
          cat <<'KEIYAKU' | node "$PWD/build/src/cli/index.js" -C "$repository" --repo "$repository" bind -
          # Git Bash coordinates

          ## Context
          Git Bash converts ordinary path arguments before Node starts.

          ## Objective
          Exercise one managed worktree lifecycle.

          ## Design
          Keep native coordinates inside the process.

          ## Region
          ~~~
          src/**
          ~~~

          ## Criteria
          ### Coordinate accepted
          The contract binds from Git Bash.
          KEIYAKU
          test -d "$repository/.keiyaku/wt"
          '@
          & $bash --noprofile --norc -lc $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  macos-native:
    name: macos-14 / native filesystem and process
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_test_files == '' }}
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --prefer-offline

      - name: Build and compile tests
        run: npm run build && npm run test:compile

      - name: Run native filesystem, process, and SQLite tests
        run: >-
          node scripts/run-tests.mjs --compiled --test-concurrency=2
          tests/path-coordinates.test.ts tests/world.test.ts
          tests/runtime-proc.test.ts tests/sqlite-transaction-lock.test.ts

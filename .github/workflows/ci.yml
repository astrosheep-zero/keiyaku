name: Test diet quick benchmark 62

on:
  push:
    branches:
      - test-diet/quick-benchmark-62

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.1
      - run: npm ci --ignore-scripts --prefer-offline
      - name: Configure Git identity
        run: |
          git config --global user.name "Keiyaku CI"
          git config --global user.email "keiyaku-ci@example.invalid"
      - name: Prime compiler artifacts equally
        run: |
          git checkout --detach bc1b478d8738d546e32e73790ab53565dc7cffc0
          npm run build >/dev/null
          git checkout --detach 6504d3fbec581140878c180c2c502aaaf6569fe5
          npm run build >/dev/null
      - name: Run one same-runner pair
        run: |
          python3 - <<'PY'
          import json, re, subprocess, time
          refs=[('baseline','bc1b478d8738d546e32e73790ab53565dc7cffc0'),('candidate','6504d3fbec581140878c180c2c502aaaf6569fe5')]
          rows=[]
          for label,ref in refs:
              subprocess.run(['git','checkout','--detach',ref],check=True,stdout=subprocess.DEVNULL)
              started=time.monotonic()
              result=subprocess.run(['npm','test'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=180)
              elapsed=time.monotonic()-started
              m=re.search(r'\[test:release\] tests (\d+) status=(\d+)',result.stdout)
              row={'variant':label,'wall_seconds':round(elapsed,3),'tests_seconds':int(m.group(1))/1000 if m else None,'exit_code':result.returncode}
              rows.append(row); print(json.dumps(row),flush=True)
              open(f'/tmp/{label}.log','w').write(result.stdout)
          if all(r['exit_code']==0 and r['tests_seconds'] is not None for r in rows):
              b,c=rows
              summary={'wall_reduction_percent':round(100*(1-c['wall_seconds']/b['wall_seconds']),2),'tests_reduction_percent':round(100*(1-c['tests_seconds']/b['tests_seconds']),2)}
              print(json.dumps(summary),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-benchmark-62
          path: /tmp/*.log
          retention-days: 7

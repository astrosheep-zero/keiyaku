name: Completion checkout export
on:
  push:
    branches: [codex/complete-contract-execution-20260905]
    paths: ['.github/workflows/completion-export.yml']
permissions:
  contents: read
jobs:
  export:
    if: github.ref == 'refs/heads/codex/complete-contract-execution-20260905'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci --ignore-scripts --prefer-offline
      - name: Package only repository objects, source, dependencies, and Node executable
        run: |
          mkdir -p /tmp/completion-export
          git bundle create /tmp/completion-export/repository.bundle HEAD refs/remotes/origin/main
          git archive HEAD | tar -x -C /tmp/completion-export
          tar -cf /tmp/completion-export/dependencies.tar node_modules plugins/*/node_modules 2>/dev/null || test -f /tmp/completion-export/dependencies.tar
          cp "$(command -v node)" /tmp/completion-export/node
          git rev-parse HEAD > /tmp/completion-export/HEAD
          tar -czf /tmp/completion-checkout.tar.gz -C /tmp/completion-export .
      - uses: actions/upload-artifact@v4
        with:
          name: completion-checkout
          path: /tmp/completion-checkout.tar.gz
          retention-days: 1
          compression-level: 0

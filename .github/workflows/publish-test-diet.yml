name: Publish restored test diet batch 4
on:
  push:
    branches: [work/test-diet-publish-20260918]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore and publish the exact local candidate tree
        shell: bash
        run: |
          set -euo pipefail
          cp .test-audit/apply-delta.py "$RUNNER_TEMP/apply-delta.py"
          cp .test-audit/delta-1.b64 "$RUNNER_TEMP/delta-1.b64"
          git config user.name 'Test Suite Maintenance'
          git config user.email 'test-maintenance@example.invalid'
          git checkout --detach 2b98e8eb509424ebc59739baab459f4479d3fd24
          git merge --no-ff ecadd1847385f8e74f7645fcb1d37c180e66aa74 -m 'test: combine previously published fixture batches 2 and 3'
          test "$(git rev-parse HEAD^{tree})" = 787e45aa11130516977020ff1b71cee7bac621e1
          python3 "$RUNNER_TEMP/apply-delta.py" "$RUNNER_TEMP/delta-1.b64"
          git diff --cached --check
          git commit -m 'test: consolidate unit boundaries and repeated fixtures (batch 4)'
          test -z "$(git ls-remote --heads origin refs/heads/test-diet/04-unit-boundaries)"
          git push origin HEAD:refs/heads/test-diet/04-unit-boundaries
          git rev-parse HEAD

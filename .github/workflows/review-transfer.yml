name: Publish reviewed repair objects
on:
  push:
    branches: [codex/review-repairs-transfer-20260910]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reconstruct exact reviewed source tree
        run: |
          set -euo pipefail
          cp .review/job.json "$RUNNER_TEMP/job.json"
          # Repair a transcription error in this transport-only base64 frame.
          # Both gzip integrity and the exact reviewed Git tree are required.
          sed 's@AwOHr06EEUHuzt7XW@AwOHr06EEYhu72Huzt7XW@' .review/runner.patch.b64 | base64 -d | gzip -d > "$RUNNER_TEMP/repair.patch"
          parent=$(jq -r .parent "$RUNNER_TEMP/job.json")
          expected=$(jq -r .tree "$RUNNER_TEMP/job.json")
          branch=$(jq -r .branch "$RUNNER_TEMP/job.json")
          git worktree add --detach "$RUNNER_TEMP/repair" "$parent"
          cd "$RUNNER_TEMP/repair"
          git apply --index "$RUNNER_TEMP/repair.patch"
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- .github)"
          tree=$(git write-tree)
          test "$tree" = "$expected"
          git config user.name 'Keiyaku Test Maintenance'
          git config user.email 'keiyaku-ci@example.invalid'
          commit=$(jq -r .message "$RUNNER_TEMP/job.json" | git commit-tree "$tree" -p "$parent")
          git push origin "$commit:refs/heads/$branch"
          printf 'REPAIR_COMMIT=%s\nREPAIR_TREE=%s\n' "$commit" "$tree"

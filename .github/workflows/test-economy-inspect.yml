name: Test economy source inspection
on:
  push:
    branches: [codex/test-economy-20260906]
    paths: ['.github/workflows/test-economy-inspect.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export repository objects only
        run: git bundle create /tmp/test-economy-source.bundle HEAD refs/remotes/origin/main
      - uses: actions/upload-artifact@v4
        with:
          name: test-economy-source
          path: /tmp/test-economy-source.bundle
          retention-days: 1

name: Apply reviewed test refinements
on:
  push:
    branches: [codex/test-economy-20260906]
    paths: ['.github/workflows/test-economy-refine.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/codex/test-economy-20260906'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Apply the reviewed per-suite bound without changing assertions
        run: |
          git config user.name 'Keiyaku test refactor'
          git config user.email 'test-refactor@example.invalid'
          python3 - <<'PY'
          import pathlib, subprocess
          path = pathlib.Path('tests/library-contract-operations.test.ts')
          before = subprocess.check_output(['git', 'rev-parse', 'HEAD:' + str(path)], text=True).strip()
          assert before == 'd8129739980c6d3a9a0610446e462cc5f6b00c94'
          source = path.read_text()
          old = 'describe("public Contract operations", { concurrency: 2 }'
          assert source.count(old) == 1
          source = source.replace(old, 'describe("public Contract operations", { concurrency: 4 }')
          after = subprocess.check_output(['git', 'hash-object', '--stdin'], input=source.encode()).decode().strip()
          assert after == 'bd2b1b0af0ebd09e9a75dfefa868045923edd618'
          path.write_text(source)
          subprocess.check_call(['git', 'add', '--', str(path)])
          subprocess.check_call(['git', 'diff', '--cached', '--check'])
          subprocess.check_call(['git', 'commit', '-m', 'test: bound independent Contract repository cases to four concurrent executions'])
          subprocess.check_call(['git', 'push', 'origin', 'HEAD:refs/heads/codex/test-economy-20260906'])
          print(subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True))
          PY

name: Test economy resumed checkpoint
on:
  push:
    branches: [codex/test-economy-20260906]
    paths: ['.github/workflows/test-economy-resume.yml']
permissions:
  contents: write
jobs:
  checkpoint:
    if: github.ref == 'refs/heads/codex/test-economy-20260906'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply reviewed source patch and verify exact blobs
        run: |
          set -euo pipefail
          branch=refs/heads/codex/test-economy-20260906
          test "$(git ls-remote origin "$branch" | cut -f1)" = "$GITHUB_SHA"
          git apply --check .test-economy-checkpoint.patch
          git apply .test-economy-checkpoint.patch
          test "$(git hash-object scripts/test-entry.mjs)" = 77678d08d0bc6fc26babafc8c092f287a75af0ac
          test "$(git hash-object tests/library-contract-operations.test.ts)" = 0a03b1dcc1578f59e451df31ffddeae3c9d665ae
          test "$(git hash-object tests/public-library.test.ts)" = aaf1c489322f280b8db1da920645cadc52580b1b
          git diff --check
          git add scripts/test-entry.mjs tests/library-contract-operations.test.ts tests/public-library.test.ts
          git rm .test-economy-checkpoint.patch
          git config user.name 'Keiyaku test refactor'
          git config user.email 'test-refactor@example.invalid'
          git commit -m 'test: drop redundant checks and avoid repeated dependency compilation'
          git push origin "HEAD:$branch"
          git show --stat --oneline HEAD

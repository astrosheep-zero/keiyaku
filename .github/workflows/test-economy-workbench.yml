name: Test economy workbench
on:
  push:
    branches: [codex/test-economy-20260906]
    paths: ['.github/workflows/test-economy-workbench.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.ref == 'refs/heads/codex/test-economy-20260906'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify reviewed source and push the exact source tree without modifying workflows
        run: |
          git config user.name 'Keiyaku test refactor'
          git config user.email 'test-refactor@example.invalid'
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, tempfile
          payload = json.loads(pathlib.Path('.test-economy-transfer.json').read_text())
          raw = lzma.decompress(base64.b64decode(payload['changes'], validate=True))
          assert hashlib.sha256(raw).hexdigest() == payload['sha256'], 'transfer digest mismatch'
          assert payload['base'] == '515b948ecde880f2f945ec736763039d4f85a601'
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          branch = 'refs/heads/codex/test-economy-20260906'
          assert subprocess.check_output(['git', 'ls-remote', 'origin', branch], text=True).split()[0] == head
          with tempfile.TemporaryDirectory() as directory:
            env = dict(os.environ, GIT_INDEX_FILE=directory + '/index')
            def git(*args, data=None):
              return subprocess.check_output(['git', *args], input=data, env=env)
            git('read-tree', payload['base'])
            entries = json.loads(raw)
            for path, *change in entries:
              assert not path.startswith('/') and '..' not in pathlib.PurePosixPath(path).parts
              if change == [None]:
                git('update-index', '--force-remove', '--', path)
                continue
              mode, operations = change
              try:
                lines = git('show', payload['base'] + ':' + path).decode().splitlines(keepends=True)
              except subprocess.CalledProcessError:
                lines = []
              for start, end, replacement in reversed(operations):
                lines[start:end] = [replacement]
              blob = git('hash-object', '-w', '--stdin', data=''.join(lines).encode()).decode().strip()
              git('update-index', '--add', '--cacheinfo', mode, blob, path)
            reviewed = git('write-tree').decode().strip()
            assert reviewed == payload['tree'], ('tree mismatch', reviewed, payload['tree'])
            # Workflow edits use the connected GitHub action, never this job token.
            for path in git('ls-files', '.github/workflows').decode().splitlines():
              git('update-index', '--force-remove', '--', path)
            for line in git('ls-tree', '-r', head, '--', '.github/workflows').decode().splitlines():
              metadata, path = line.split('\t')
              mode, kind, blob = metadata.split()
              assert kind == 'blob'
              git('update-index', '--add', '--cacheinfo', mode, blob, path)
            tree = git('write-tree').decode().strip()
            assert not git('diff', head, tree, '--', '.github/workflows')
            commit = git('commit-tree', tree, '-p', head, '-m', 'test: prune redundant checks and compile isolated tests once').decode().strip()
          subprocess.check_call(['git', 'push', 'origin', commit + ':' + branch])
          subprocess.check_call(['git', 'reset', '--hard', commit])
          print('Reviewed source tree:', reviewed, 'Pushed commit:', commit, 'Tree including unchanged workbench:', tree)
          PY
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.14.1
      - run: npm ci --ignore-scripts --prefer-offline
      - name: Configure fixture Git identity
        run: |
          git config --global user.name 'Keiyaku CI'
          git config --global user.email 'keiyaku-ci@example.invalid'
      - name: Full default verification
        run: npm test
      - name: Full semantic typecheck and lint
        run: npm run test:typecheck && npm run lint
      - name: Packaged CLI end-to-end verification
        run: npm run test:e2e:built

name: Publish checked test slices
on:
  push:
    branches: [codex/test-workbench-20260909]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
      - name: Reproduce and publish checked consumer slice
        run: |
          cp .workbench/consumers.py /tmp/consumers.py
          git checkout --detach 708334cb99e93147a0c572a2ebaa1d63e6b00620
          npm ci --ignore-scripts --prefer-offline
          python3 /tmp/consumers.py
          npx prettier --write --print-width 120 tests/public-library.test.ts 'tests/fixtures/consumers/*.ts'
          git add tests scripts/test-manifests.mjs tsconfig.tests.json
          test "$(git write-tree)" = 200a75dbe180fb96b9597985430a433df58d88d3
          echo '' | base64 -d | git hash-object -t commit -w --stdin
          git push origin f736135c7a0de4a3c02374ab3a860f830f4fef42:refs/heads/codex/test-package-consumers-20260909
